<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DataContainer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f6f8fb; }
        .panel { border: 1px solid #e5e7eb; border-radius: 8px; }
        .json-cell { max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container-fluid">
        <a class="navbar-brand fw-semibold" href="/dashboard">Fintech Reconciliation Demo</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/dashboard">Dashboard</a>
            <a class="nav-link" href="/sftp">SFTP</a>
            <a class="nav-link active" href="/data-containers">DataContainer</a>
            <a class="nav-link" href="/reconciliation-results">Results</a>
        </div>
    </div>
</nav>

<main class="container-fluid py-4">
    <div class="mb-4">
        <h1 class="h3 mb-1">DataContainer</h1>
        <p class="text-secondary mb-0">Latest 100 partner records imported from Excel.</p>
    </div>

    <div class="bg-white panel table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th>Request ID</th>
                <th>Identify</th>
                <th>Reconciliation Date</th>
                <th>Operation</th>
                <th>Created Date</th>
                <th>Partner Data</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(records)}">
                <td colspan="6" class="text-center text-secondary py-4">No records found.</td>
            </tr>
            <tr th:each="record : ${records}">
                <td><code th:text="${record.requestId}">request-id</code></td>
                <td th:text="${record.identify}">MOMO</td>
                <td th:text="${record.reconciliationDate}">-</td>
                <td>
                    <span class="badge text-bg-info" th:text="${record.operationStatus}">IN_PROGRESS</span>
                </td>
                <td th:text="${record.createdDate}">-</td>
                <td class="json-cell">
                    <code th:text="${record.partnerData}">{}</code>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
